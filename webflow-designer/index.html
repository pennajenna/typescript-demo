
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />
    <title>Mini Webflow Designer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <header class="app-header">
      <h1>Mini Webflow Designer</h1>
    </header>

    <main class="workspace">
      <aside class="editor">
        <h2>Page Settings</h2>

        <label for="headingInput">Heading</label>
        <input
          id="headingInput"
          type="text"
          value="Welcome to my website"
        />

        <label for="backgroundColorInput">
          Background Color
        </label>
        <input
          id="backgroundColorInput"
          type="color"
          value="#ffffff"
        />
      </aside>

      <section class="preview-panel">
        <h2>Live Preview</h2>
        <div id="preview"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
