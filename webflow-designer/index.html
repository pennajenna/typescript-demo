<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Webflow Designer</title>
</head>

<body>
  <h1>Mini Website Designer</h1>

  <section>
    <h2>Editor</h2>

    <label for="headingInput">Page heading:</label>
    <input id="headingInput" type="text" value="Welcome to my website" />

  <section>

    <div id="preview">
      <h1 id="previewHeading">Welcome to my website</h1>
    </div>
  </section>

  <script type="module" src="/src/main.ts"></script>
</body>
